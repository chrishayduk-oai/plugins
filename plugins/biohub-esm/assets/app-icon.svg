  <path d="M103 304c59 98 123 103 173 17 45-76 82-92 135-33" fill="none" stroke="url(#ribbon)" stroke-width="36" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M129 238c42-78 95-81 143-10 51 76 95 69 121 20" fill="none" stroke="url(#ribbon)" stroke-width="22" stroke-linecap="round" filter="url(#shadow)"/>
  <g fill="#f7fffd">
