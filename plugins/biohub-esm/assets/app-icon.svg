<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Biohub ESM</title>
  <desc id="desc">An abstract protein ribbon crossing a learned feature map.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2f31"/>
      <stop offset="1" stop-color="#17645d"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ce3d1"/>
      <stop offset="0.5" stop-color="#f5d66d"/>
      <stop offset="1" stop-color="#ff8f73"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001f20" flood-opacity=".35"/>
